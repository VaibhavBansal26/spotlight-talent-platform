services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotlight
      POSTGRES_USER: spotlight
      POSTGRES_PASSWORD: spotlight
    ports:
      - "5432:5432"
    volumes:
      - spotlight_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotlight -d spotlight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - spotlight_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommender:
    build:
      context: ./services/recommender
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  spotlight_postgres:
  spotlight_redis:
