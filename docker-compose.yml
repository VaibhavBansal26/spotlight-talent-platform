services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotlight
      POSTGRES_USER: spotlight
      POSTGRES_PASSWORD: spotlight
    ports:
      - "5432:5432"
    volumes:
      - spotlight_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotlight -d spotlight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - spotlight_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommender:
    build:
      context: ./services/recommender
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  media:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spotlight
      MINIO_ROOT_PASSWORD: development-media-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - spotlight_media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  media-init:
    image: minio/mc:RELEASE.2025-04-21T22-05-20Z
    depends_on:
      media:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://media:9000 spotlight development-media-secret && mc mb --ignore-existing local/spotlight-media && mc anonymous set download local/spotlight-media"]

volumes:
  spotlight_postgres:
  spotlight_redis:
  spotlight_media:
